<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0c0c0c"><meta name="description" content="Renythia, your browser rhythm game. A browser port in development based on the current open-source Rhythia rewrite."><title>Renythia</title><link rel="icon" href="assets/icon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css"></head><body><main class="lock-screen"><section class="lock-card"><div class="brand"><img src="assets/icon.svg" alt="">Renythia</div><span class="eyebrow">Your private play space</span><h1>Back to the rhythm<span style="color:var(--accent)">.</span></h1><p>Unlock your game. Find your flow.</p><form id="unlock-form"><label for="password">GAME PASSWORD</label><input id="password" type="password" autocomplete="current-password" required placeholder="Enter your password"><button class="primary" id="unlock-button">Unlock & play →</button><div id="unlock-error" class="error" role="alert"></div></form><div class="lock-foot"><span class="status-dot"></span> Current Rhythia rewrite · Chromium browser port<br><a href="source.zip">Open-source code</a> · <a href="LICENSE">AGPL-3.0</a></div></section></main><noscript>This game needs JavaScript, WebGL, and Web Audio enabled.</noscript><script src="unlock.js" defer></script></body></html>
